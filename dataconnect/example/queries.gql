mutation CreateUser {
  user_insert(data: {id_expr: "auth.uid", email: "user@example.com", displayName: "New User"})
}

mutation UpdateUser($displayName: String!) @auth(level: USER) {
  user_update(key: {id_expr: "auth.uid"}, data: {displayName: $displayName})
}

mutation DeleteUser @auth(level: USER) {
  user_delete(key: {id_expr: "auth.uid"})
}

query GetCurrentUser @auth(level: USER) {
  user(key: {id_expr: "auth.uid"}) {
    id
    email
    displayName
  }
}

query ListAllUsers @auth(level: PUBLIC, insecureReason: "Public directory of users") {
  users {
    id
    displayName
  }
}

mutation CreateProject($name: String!, $description: String) @auth(level: USER) {
  project_insert(data: {name: $name, description: $description, ownerId_expr: "auth.uid"})
}

mutation UpdateProject($id: UUID!, $name: String) @auth(level: USER) {
  project_update(id: $id, data: {name: $name})
}

mutation DeleteProject($id: UUID!) @auth(level: USER) {
  project_delete(id: $id)
}

query GetProject($id: UUID!) @auth(level: PUBLIC, insecureReason: "Projects are public") {
  project(id: $id) {
    name
    description
    owner { displayName }
  }
}

query ListProjects @auth(level: PUBLIC, insecureReason: "Public list of projects") {
  projects {
    id
    name
  }
}

mutation CreateTask($title: String!, $projectId: UUID!, $assignedUserId: UUID) @auth(level: USER) {
  task_insert(data: {title: $title, projectId: $projectId, assignedUserId: $assignedUserId})
}

mutation UpdateTask($id: UUID!, $status: String!) @auth(level: USER) {
  task_update(id: $id, data: {status: $status})
}

mutation DeleteTask($id: UUID!) @auth(level: USER) {
  task_delete(id: $id)
}

query GetTask($id: UUID!) @auth(level: PUBLIC, insecureReason: "Tasks are public") {
  task(id: $id) {
    title
    status
    project { name }
  }
}

query ListTasks @auth(level: PUBLIC, insecureReason: "Public list of tasks") {
  tasks {
    id
    title
  }
}

mutation AddMember($projectId: UUID!, $userId: UUID!) @auth(level: USER) {
  projectMember_insert(data: {projectId: $projectId, userId: $userId, role: "member"})
}

mutation UpdateMemberRole($projectId: UUID!, $userId: UUID!, $role: String!) @auth(level: USER) {
  projectMember_update(key: {projectId: $projectId, userId: $userId}, data: {role: $role})
}

mutation RemoveMember($projectId: UUID!, $userId: UUID!) @auth(level: USER) {
  projectMember_delete(key: {projectId: $projectId, userId: $userId})
}

query GetProjectMember($projectId: UUID!, $userId: UUID!) @auth(level: PUBLIC, insecureReason: "Membership status is public") {
  projectMember(key: {projectId: $projectId, userId: $userId}) {
    role
    user { displayName }
  }
}

query ListProjectMembers($projectId: UUID!) @auth(level: PUBLIC, insecureReason: "Public list of members") {
  projectMembers(where: {projectId: {eq: $projectId}}) {
    user { displayName }
    role
  }
}